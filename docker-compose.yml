version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: waterwatch_postgres
    environment:
      POSTGRES_USER: waterwatch_user
      POSTGRES_PASSWORD: waterwatch_secure_password_2026
      POSTGRES_DB: waterwatch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waterwatch_user -d waterwatch_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: waterwatch_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waterwatch_backend
    environment:
      - DATABASE_URL=postgresql://waterwatch_user:waterwatch_secure_password_2026@postgres:5432/waterwatch_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_CELERY=true
      - SECRET_KEY=waterwatch-super-secret-jwt-key-2026-production-ready
      - ENVIRONMENT=production
      - DEBUG=false
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waterwatch_celery_worker
    command: celery -A app.tasks.celery_app.celery_app worker -l info
    environment:
      - DATABASE_URL=postgresql://waterwatch_user:waterwatch_secure_password_2026@postgres:5432/waterwatch_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - USE_CELERY=true
      - SECRET_KEY=waterwatch-super-secret-jwt-key-2026-production-ready
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: waterwatch_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  uploads_data:

